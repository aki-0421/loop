version: 1

language:
  default: en
  allowSkillOverride: true

agent:
  default: codex
  adapters:
    codex:
      command: codex
      args: [exec, --json]
      prompt: stdin
      env: {}
    claude:
      command: claude
      args: [-p, "{prompt}", --verbose, --output-format, stream-json, --dangerously-skip-permissions]
      prompt: arg
      env: {}

run:
  maxIterations: 0
  maxParallelTasks: 2
  maxTaskAttempts: 2
  maxRoleAgentRestarts: 1
  agentIdleTimeoutSeconds: 600

skills:
  sourceDir: .agents/skills
  syncOnRun: false
  targets:
    codex:
      mode: off
      path: .agents/skills

git:
  integration:
    mode: pr
    local_merge:
      squash: true
      deleteBranch: true
    pr:
      create: false
      push: true
      waitChecks: true
      checksRequiredOnly: false
      checksStartupDelaySeconds: 5
      checksDiscoveryTimeoutSeconds: 60
      checksPollIntervalSeconds: 5
      checksWatchTimeoutSeconds: 3600
      mergeWhenChecksPass: true
      deleteBranch: true
      humanReview: false

validation:
  commands: []
  agentMayAddCommands: true
  requireRequiredCommandsToPass: true

logs:
  dir: .loop/runs
  retainRawAgentOutput: true
  redactEnv: true
