version: 1

language:
  default: en
  allowSkillOverride: true

agent:
  default: codex
  adapters:
    codex:
      command: codex
      args: [exec, --json]
      prompt: stdin
      env: {}

run:
  maxIterations: 0

skills:
  sourceDir: .agents/skills
  syncOnRun: false
  targets:
    codex:
      mode: off
      path: .agents/skills

git:
  integration:
    mode: local_merge
    local_merge:
      squash: true
      deleteBranch: true
    pr:
      create: false
      push: true
      waitChecks: true
      checksRequiredOnly: false
      checksStartupDelaySeconds: 5
      checksDiscoveryTimeoutSeconds: 60
      checksPollIntervalSeconds: 5
      checksWatchTimeoutSeconds: 3600
      mergeWhenChecksPass: true
      deleteBranch: true

validation:
  commands: []
  agentMayAddCommands: true
  requireRequiredCommandsToPass: true

logs:
  dir: .loop/runs
  retainRawAgentOutput: true
  redactEnv: true
