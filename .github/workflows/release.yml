name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Release
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e GITHUB_TOKEN \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.2-3 \
            -lc "git config --global --add safe.directory /work && make release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
